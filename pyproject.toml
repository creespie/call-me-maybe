[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "numpy>=2.0,<2.5",
    "pydantic>=2.13.4",
]

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }

[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "llm_sdk",
    "torch",
    "transformers",
    "huggingface_hub"
]
ignore_missing_imports = true
follow_imports = "skip"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
]